name: check-setup

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26 on 2026-10-19
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests google-api-python-client google-auth-oauthlib pillow

      - name: Set up credentials
        env:
          S: ${{ secrets.YT_CLIENT_SECRET }}
          T: ${{ secrets.YT_TOKEN }}
          RS: ${{ secrets.YT_RESERVE_CLIENT_SECRET }}
          RT: ${{ secrets.YT_RESERVE_TOKEN }}
        run: |
          [ -n "$S" ] && printf '%s' "$S" > yt_client_secret.json
          [ -n "$T" ] && printf '%s' "$T" > yt_token.json
          [ -n "$RS" ] && printf '%s' "$RS" > yt_reserve_client_secret.json
          [ -n "$RT" ] && printf '%s' "$RT" > yt_reserve_token.json
          true

      - name: Run setup check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python check_setup.py
